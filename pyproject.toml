[project]
name = "fastapi-pract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
fastapi-pract = "fastapi_pract:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
