[project]
name = "fastapi-pract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
fastapi-pract = "fastapi_pract:main"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
